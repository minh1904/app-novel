  <script>
    const items = [{"id":1,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"addressing","srcText":"\"Did you have to drag us along as well?\" Tenuk snapped as he climbed off Thassalin's back, sliding down his tail. \"And we left Retvik behind! We abandoned our big, strong, fighty guy! How is he going to get to us?\"","candidate1":"\"Anh có cần kéo chúng tôi theo luôn không?\" Tenuk gắt lên khi anh ta trèo xuống khỏi lưng Thassalin, trượt dọc theo đuôi của nó. \"Và chúng ta bỏ Retvik lại phía sau! Chúng ta đã bỏ rơi anh chàng to lớn, mạnh mẽ, hiếu chiến của mình! Làm sao anh ấy đến được chỗ chúng ta?\"","candidate2":"“Anh có nhất thiết phải kéo chúng tôi theo không?” Tenuk gắt lên khi anh leo xuống lưng Thassalin, trượt xuống đuôi anh ta. “Và chúng ta đã bỏ lại Retvik rồi! Chúng ta đã bỏ rơi người đàn ông to lớn, mạnh mẽ, hiếu chiến của chúng ta! Làm sao anh ấy đến được chỗ chúng ta?”"},{"id":2,"chapter":"ja-irene/03","workId":"ja-irene","stratum":"glossary","srcText":"　いつもと違う母の様子を感じ取ったのだろう。ヴィルヘルムは背筋を伸ばして緊張した顔をしている。","candidate1":"Chắc là con đã cảm nhận được thái độ khác lạ của mẹ. Wilhelm ngồi thẳng lưng, vẻ mặt căng thẳng.","candidate2":"Tôi ngồi dậy thì thấy trên bệ cửa sổ có một bình hoa. Đó là những bông hoa trắng và xanh nhạt, vừa mới hái vào buổi sáng."},{"id":3,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"ordinary","srcText":"\"But... one of them is a giant monster!\"","candidate1":"\"Nhưng... một trong số chúng là một con quái vật khổng lồ!\"","candidate2":"“Nhưng… một trong số đó là quái vật khổng lồ!”"},{"id":4,"chapter":"ja-irene/05","workId":"ja-irene","stratum":"addressing","srcText":"「今朝、君の父――公爵閣下から書状が届いたよ」","candidate1":"“Sáng nay, cha cháu — Công tước đại nhân — đã gửi một lá thư.”","candidate2":"“Sáng nay, ta nhận được thư từ cha cháu — Công tước.”"},{"id":5,"chapter":"ja-irene/05","workId":"ja-irene","stratum":"glossary","srcText":"　蟄居となれば、ロレッタは領地の屋敷から一歩も出られない。公爵家から睨まれた令嬢に、縁談が来ることはまずないだろう。ロレッタはこの先ずっと、あの屋敷の中で年を取っていくことになる。","candidate1":"Bị giam lỏng, Loretta sẽ không thể bước ra khỏi dinh thự ở lãnh địa. Một tiểu thư bị Công tước gia ghét bỏ thì khó mà có hôn sự được. Loretta sẽ phải sống hết quãng đời còn lại trong dinh thự đó.","candidate2":"Nếu bị giam lỏng, Loretta sẽ không thể rời khỏi dinh thự ở lãnh địa dù chỉ một bước. Một tiểu thư bị Công tước gia để mắt tới chắc chắn sẽ không có hôn sự nào. Loretta sẽ phải sống già trong dinh thự đó suốt quãng đời còn lại."},{"id":6,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"ordinary","srcText":"　それにしても、と流れ込んできたばかりの記憶を眺めてみて、わたくしは少しばかり唸った。","candidate1":"Dù sao đi nữa, nhìn vào những ký ức vừa ùa về, tôi khẽ rên rỉ một chút.","candidate2":"Dù vậy, khi xem xét những ký ức vừa tràn vào, tôi khẽ rên lên một tiếng."},{"id":7,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"addressing","srcText":"「わたし見たのです。アデラインさまが、おば様を、押したのです」","candidate1":"“Con đã thấy. Cô Adeline đã đẩy dì.”","candidate2":"“Cháu đã nhìn thấy. Tiểu thư Adeline đã đẩy dì đấy ạ.”"},{"id":8,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"glossary","srcText":"「ご無事ですか、母様。階段から落ちたと聞いて驚きました！」","candidate1":"“Mẹ có ổn không ạ? Con đã rất sợ khi nghe tin mẹ ngã cầu thang!”","candidate2":"“Người có sao không, mẫu thân? Con đã rất sốc khi nghe nói người ngã cầu thang!”"},{"id":9,"chapter":"ja-irene/03","workId":"ja-irene","stratum":"ordinary","srcText":"「あなたにどう償えばいいのか、わたくしにはまだ見当もつかないの」","candidate1":"Irene chưa bao giờ hỏi ai là người cắm hoa. Vì nó đẹp, nên đó là một điều tốt.","candidate2":"«Ta phải đền bù cho con thế nào, ta vẫn chưa biết nữa.»"},{"id":10,"chapter":"zh-kongyiji/01","workId":"zh-kongyiji","stratum":"addressing","srcText":"在这些时候，我可以附和着笑，掌柜是决不责备的。而且掌柜见了孔乙己，也每每这样问他，引人发笑。孔乙己自己知道不能和他们谈天，便只好向孩子说话。有一回对我说道，『你读过书么？』我略略点一点头。他说，『读过书，……我便考你一考。茴香豆的茴字，怎样写的？』我想，讨饭一样的人，也配考我么？便回过脸去，不再理会。孔乙己等了许久，很恳切的说道：『不能写罢？……我教给你，记着！这些字应该记着。将来做掌柜的时候，写帐要用。』我暗想我和掌柜的等级还很远呢，而且我们掌柜也从不将茴香豆上帐；又好笑，又不耐烦，懒懒的答他道：『谁要你教，不是草头底下一个来回的回字么？』孔乙己显出极高兴的样子，将两个指头的长指甲敲着柜台，点头说：『对呀对呀！……回字有四样写法，你知道么？』我愈不耐烦了，努着嘴走远。孔乙己刚用指甲蘸了酒，想在柜上写字，见我毫不热心，便又叹一口气，显出极惋惜的样子。","candidate1":"Trong những lúc như vậy, tôi có thể hùa theo mà cười, ông chủ nhất định sẽ không quở trách. Hơn nữa, ông chủ thấy Khổng Ất Kỷ cũng thường hỏi ông ta như vậy, khiến mọi người bật cười. Khổng Ất Kỷ tự biết không thể nói chuyện với họ, đành phải nói chuyện với trẻ con. Một lần, ông ta hỏi tôi: “Cháu đã đọc sách chưa?” Tôi khẽ gật đầu. Ông ta nói: “Đọc sách rồi, vậy ta đố cháu một câu. Chữ ‘hồi’ trong đậu hồi viết thế nào?” Tôi nghĩ, một người ăn xin như vậy mà cũng xứng đáng đố mình sao? Thế là tôi quay mặt đi, không thèm để ý nữa. Khổng Ất Kỷ đợi rất lâu, nói một cách rất chân thành: “Không viết được phải không? ...Ta dạy cháu, nhớ nhé! Những chữ này phải nhớ. Sau này làm chủ tiệm, ghi sổ sách sẽ dùng đến.” Tôi thầm nghĩ cấp bậc của mình và ông chủ còn xa lắm, hơn nữa ông chủ của chúng tôi cũng chẳng bao giờ ghi đậu hồi vào sổ sách; vừa buồn cười, vừa sốt ruột, lười biếng đáp lại ông ta: “Ai cần ông dạy, chẳng phải là chữ ‘hồi’ có bộ thảo ở dưới sao?” Khổng Ất Kỷ lộ vẻ vô cùng vui mừng, dùng hai ngón tay có móng dài gõ vào quầy, gật đầu nói: “Đúng rồi, đúng rồi! ...Chữ ‘hồi’ có bốn cách viết, cháu có biết không?” Tôi càng sốt ruột hơn, bĩu môi bỏ đi. Khổng Ất Kỷ vừa nhúng ngón tay vào rượu, định viết chữ lên quầy, thấy tôi chẳng mặn mà gì, liền thở dài một tiếng, lộ vẻ vô cùng tiếc nuối.","candidate2":"Trong những lúc như thế này, tôi có thể hùa theo mà cười, chủ quán tuyệt đối không quở trách. Vả lại, chủ quán thấy Khổng Ất Kỷ, cũng thường xuyên hỏi ông ta như vậy, khiến người ta buồn cười. Khổng Ất Kỷ tự biết không thể nói chuyện với họ, nên đành phải nói chuyện với lũ trẻ con. Có một lần ông ta nói với tôi: \"Cậu đã từng đọc sách chưa?\" Tôi khẽ gật đầu. Ông ta nói: \"Đã đọc sách rồi,... vậy tôi thử đố cậu một câu. Chữ \"hồi\" trong đậu hồi viết thế nào?\" Tôi nghĩ, một người ăn mày như vậy, cũng xứng để đố tôi sao? Liền quay mặt đi, không thèm để ý nữa. Khổng Ất Kỷ chờ rất lâu, rồi rất tha thiết nói: \"Không viết được sao? ... Tôi dạy cho cậu, nhớ nhé! Những chữ này nên nhớ. Sau này làm chủ quán, sẽ dùng để viết sổ sách.\" Tôi thầm nghĩ tôi và chủ quán còn cách xa đẳng cấp lắm, vả lại chủ quán chúng tôi cũng chưa bao giờ ghi đậu hồi vào sổ sách; vừa buồn cười, vừa sốt ruột, lười biếng đáp ông ta: \"Ai cần ông dạy, chẳng phải là chữ 'hồi' có bộ thảo ở trên sao?\" Khổng Ất Kỷ lộ vẻ vô cùng vui mừng, dùng hai ngón tay có móng dài gõ vào quầy, gật đầu nói: \"Đúng rồi đúng rồi! ... Chữ 'hồi' có bốn cách viết, cậu biết không?\" Tôi càng thêm sốt ruột, bĩu môi bỏ đi xa. Khổng Ất Kỷ vừa dùng móng tay chấm rượu, định viết chữ lên quầy, thấy tôi chẳng mấy nhiệt tình, bèn lại thở dài một tiếng, lộ vẻ vô cùng tiếc nuối."},{"id":11,"chapter":"zh-kongyiji/01","workId":"zh-kongyiji","stratum":"glossary","srcText":"听人家背地里谈论，孔乙己原来也读过书，但终于没有进学，又不会营生；于是愈过愈穷，弄到将要讨饭了。幸而写得一笔好字，便替人家钞钞书，换一碗饭吃。可惜他又有一样坏脾气，便是好喝懒做。坐不到几天，便连人和书籍纸张笔砚，一齐失踪。如是几次，叫他钞书的人也没有了。孔乙己没有法，便免不了偶然做些偸窃的事。但他在我们店里，品行却比别人都好，就是从不拖欠；虽然间或没有现钱，暂时记在粉板上，但不出一月，定然还清，从粉板上拭去了孔乙己的名字。","candidate1":"Nghe người ta nói sau lưng, Khổng Ất Kỷ trước đây cũng từng đọc sách, nhưng cuối cùng không thi đậu, lại không biết mưu sinh; thế là ngày càng nghèo, đến mức sắp phải đi ăn xin. May mà chữ viết đẹp, nên thường chép sách thuê cho người khác, đổi lấy một bát cơm ăn. Đáng tiếc là ông ta lại có một tật xấu, đó là thích uống rượu và lười biếng. Ngồi chưa được mấy ngày, thì cả người lẫn sách vở, giấy bút mực đều biến mất tăm. Cứ thế vài lần, người thuê anh chép sách cũng không còn nữa. Khổng Ất Kỷ không còn cách nào, đành phải thỉnh thoảng làm một vài việc trộm cắp. Nhưng ở tiệm chúng tôi, tư cách của ông ta lại tốt hơn những người khác, đó là không bao giờ nợ nần; tuy đôi khi không có tiền mặt, tạm ghi vào bảng phấn, nhưng không quá một tháng, nhất định sẽ trả hết, và tên Khổng Ất Kỷ sẽ được xóa khỏi bảng phấn.","candidate2":"Nghe người ta lén lút bàn tán, Khổng Ất Kỷ vốn cũng từng đọc sách, nhưng cuối cùng không đỗ đạt, lại không biết làm ăn sinh nhai; thế là càng ngày càng nghèo, đến nỗi sắp phải đi ăn mày. May mà viết chữ rất đẹp, nên ông ta chép sách thuê cho người khác, đổi lấy một bát cơm ăn. Đáng tiếc là ông ta lại có một tật xấu nữa, đó là thích uống rượu và lười làm. Ngồi chưa được mấy ngày, thì cả người lẫn sách vở, giấy bút mực nghiễn đều mất tăm. Cứ như thế mấy lần, những người thuê ông ta chép sách cũng không còn nữa. Khổng Ất Kỷ hết cách, bèn không tránh khỏi thỉnh thoảng làm vài việc trộm cắp. Nhưng ở quán chúng tôi, nhân phẩm của ông ta lại tốt hơn những người khác, chính là không bao giờ nợ nần dây dưa; dù đôi khi không có tiền mặt, tạm ghi vào bảng phấn, nhưng không quá một tháng nhất định sẽ trả hết, và tên Khổng Ất Kỷ sẽ được xóa khỏi bảng phấn."},{"id":12,"chapter":"ja-irene/05","workId":"ja-irene","stratum":"ordinary","srcText":"　読み終えてから、僕はしばらく手紙から目を離せなかった。","candidate1":"Sau khi đọc xong, tôi không rời mắt khỏi lá thư một lúc.","candidate2":"Sau khi đọc xong, tôi không thể rời mắt khỏi lá thư một lúc lâu."},{"id":13,"chapter":"ja-irene/04","workId":"ja-irene","stratum":"addressing","srcText":"『ごめんなさいね、ティルダ。せっかく用意してくれたのに』","candidate1":"“Xin lỗi cô nhé, Tilda. Cô đã mất công chuẩn bị rồi.”","candidate2":"『Ta xin lỗi con nhé, Tilda. Con đã cất công chuẩn bị rồi mà.』"},{"id":14,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"glossary","srcText":"A burst of flames erupted from Thassalin's jaws as the colossal Thraki set fire to a very specific patch of forest, then circled above, watching for moment. Weirdly, as he had slowed down, the weird screaming noise from behind him had stopped. Thassalin had forgotten he had passengers on his back.","candidate1":"Một tràng lửa phun ra từ hàm của Thassalin khi Thraki khổng lồ đốt cháy một khoảng rừng rất cụ thể, sau đó bay vòng trên không, quan sát. Kỳ lạ là, khi anh ta chậm lại, tiếng la hét kỳ lạ phía sau anh ta đã dừng lại. Thassalin đã quên rằng mình có hành khách trên lưng.","candidate2":"Một luồng lửa bùng lên từ hàm của Thassalin khi Thraki khổng lồ đốt cháy một khoảnh rừng rất cụ thể, sau đó lượn vòng phía trên, quan sát một lát. Kỳ lạ thay, khi anh ta giảm tốc độ, tiếng la hét kỳ lạ từ phía sau anh ta đã dừng lại. Thassalin đã quên rằng mình có hành khách trên lưng."},{"id":15,"chapter":"zh-hant-xiyouji/02","workId":"zh-hant-xiyouji","stratum":"ordinary","srcText":"畢竟不知怎生結果，居此界終始如何，且聽下回分解。","candidate1":"Rốt cuộc không biết kết quả sẽ ra sao, ở thế giới này rồi sẽ ra sao, hãy nghe hồi sau kể tiếp.","candidate2":"Rốt cuộc không biết kết quả ra sao, ở thế giới này bắt đầu và kết thúc thế nào, hãy nghe hồi sau phân giải."},{"id":16,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"addressing","srcText":"\"Hey, Tenuk, do you mind shapeshifting into something that can fly?\" Kayel asked.","candidate1":"“Này Tenuk, cậu có phiền biến hình thành thứ gì đó có thể bay không?” Kayel hỏi.","candidate2":"\"Này, Tenuk, anh có phiền biến hình thành thứ gì đó có thể bay không?\" Kayel hỏi."},{"id":17,"chapter":"zh-hant-xiyouji/02","workId":"zh-hant-xiyouji","stratum":"glossary","srcText":"悟空聞說，毛骨悚然，叩頭禮拜道：「萬望老爺垂憫，傳與躲避三災之法，到底不敢忘恩。」祖師道：「此亦無難，只是你比他人不同，故傳不得。」悟空道：「我也頭圓頂天，足方履地，一般有九竅四肢，五臟六腑，何以比人不同？」祖師道：「你雖然像人，卻比人少腮。」原來那猴子孤拐面，凹臉尖嘴。悟空伸手一摸，笑道：「師父沒成算。我雖少腮，卻比人多這個素袋，亦可准折過也。」祖師說：「也罷，你要學那一般？有一般天罡數，該三十六般變化；有一般地煞數，該七十二般變化。」悟空道：「弟子願多裡撈摸，學一個地煞變化罷。」祖師道：「既如此，上前來，傳與你口訣。」遂附耳低言，不知說了些甚麼妙法。這猴王也是他一竅通時百竅通，當時習了口訣，自修自煉，將七十二般變化都學成了。","candidate1":"Ngộ Không nghe nói, lông tóc dựng ngược, dập đầu lễ bái thưa: \"Kính mong lão gia rủ lòng thương xót, truyền cho con pháp thuật tránh ba tai họa, con đời đời không dám quên ơn.\" Tổ Sư nói: \"Cái này cũng không khó, chỉ là ngươi khác với người khác, nên không truyền được.\" Ngộ Không nói: \"Ta cũng đầu tròn đội trời, chân vuông đạp đất, cũng có chín khiếu tứ chi, ngũ tạng lục phủ, sao lại khác người?\" Tổ Sư nói: \"Con tuy giống người, nhưng lại ít má hơn người.\" Thì ra con khỉ đó mặt gồ xương, má hóp miệng nhọn. Ngộ Không vươn tay sờ một cái, cười nói: \"Sư phụ tính toán không chuẩn. Con tuy ít má, nhưng lại hơn người cái túi chứa này, cũng có thể bù trừ được chứ?\" Tổ Sư nói: \"Thôi được, con muốn học loại nào? Có loại Thiên Cương số, gồm ba mươi sáu phép biến hóa; có loại Địa Sát số, gồm bảy mươi hai phép biến hóa.\" Ngộ Không nói: \"Đệ tử xin chọn cái nhiều hơn, học phép biến hóa Địa Sát.\" Tổ Sư nói: \"Nếu đã vậy, con lại đây, ta truyền cho con khẩu quyết.\" Rồi ghé tai nói nhỏ, không biết đã truyền những diệu pháp gì. Hầu Vương này cũng là một khiếu thông thì trăm khiếu thông, lúc ấy đã học được khẩu quyết, tự mình tu luyện, thành thục cả bảy mươi hai phép biến hóa.","candidate2":"Mày đừng sợ, cứ ăn một quyền của Lão Tôn đây!” Vừa dứt lời, Tôn Ngộ Không nhảy lên, giáng một quyền vào mặt yêu quái. Ma vương đưa tay đỡ đòn: “Ngươi lùn tịt như vậy, ta cao lớn như thế; ngươi muốn dùng quyền, ta muốn dùng đao. Dùng đao giết ngươi thì cũng bị người ta cười chê. Đợi ta bỏ đao xuống, cùng ngươi đấu một trận quyền.” Ngộ Không nói: “Nói chí lý! Hảo hán tử, đến đây!” Ma vương ném đao xuống, tung quyền đánh tới, Ngộ Không liền xông vào đối đầu. Hai kẻ họ, quyền đấm chân đá, xông vào nhau kịch liệt. Thì ra, quyền dài tuy uy lực nhưng dễ sơ hở, quyền ngắn tuy đơn giản nhưng chắc chắn. Ma vương bị Ngộ Không vờn quanh, đấm vào sườn, thụi vào háng, mấy cú chí mạng khiến hắn bị thương nặng. Hắn né tránh, cầm lấy thanh đại đao thép to bản, bổ thẳng vào đầu Ngộ Không. Ngộ Không nhanh chóng lách mình, yêu quái bổ hụt. Ngộ Không thấy hắn hung dữ, liền dùng thân ngoại thân pháp, nhổ một nắm lông, bỏ vào miệng nhai nát, phun lên không trung, hô một tiếng: “Biến!” Lập tức biến thành ba, bốn trăm con khỉ nhỏ, vây quanh túm tụm."},{"id":18,"chapter":"ja-irene/04","workId":"ja-irene","stratum":"ordinary","srcText":"　あのときの、悲しそうなお顔を私は今もよく覚えている。","candidate1":"Tôi vẫn còn nhớ rõ khuôn mặt buồn bã của người lúc đó.","candidate2":"Tôi vẫn nhớ rõ vẻ mặt buồn bã của người lúc đó."},{"id":19,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"addressing","srcText":"「ロレッタ。言いなさい。母様に隠し事をするものではない」","candidate1":"“Loretta. Nói đi. Không được giấu diếm mẫu thân.”","candidate2":"“Loretta. Con nói đi. Không được giấu mẹ chuyện gì cả.”"},{"id":20,"chapter":"ja-irene/04","workId":"ja-irene","stratum":"glossary","srcText":"　ミルク粥。伯爵家にいた頃、幼少のみぎりからイレーヌ様が熱を出されるたびに私が作っていたものだ。牛乳で米を煮て、蜂蜜を少し落とすだけの、なんということもない代物である。","candidate1":"Cháo sữa. Đó là món tôi thường nấu cho phu nhân Irène mỗi khi người bị sốt, từ khi còn nhỏ ở nhà Bá tước. Nó chẳng có gì đặc biệt, chỉ là gạo nấu với sữa, thêm chút mật ong.","candidate2":"Cháo sữa. Món cháo mà tôi thường nấu cho phu nhân Irène mỗi khi người bị sốt, từ khi còn nhỏ, lúc người còn ở nhà Bá tước. Nó chỉ là một món ăn đơn giản, chỉ cần nấu gạo với sữa rồi cho thêm một chút mật ong thôi."},{"id":21,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"ordinary","srcText":"Snarling and hissing, the creature flew upwards, spitting into the air. Everything suddenly went dark, as if the monster was sucking the light from the sky itself, replacing it with a cloud of perpetual night.","candidate1":"Gầm gừ và rít lên, con quái vật bay vút lên, phun nước bọt vào không khí. Mọi thứ đột nhiên tối sầm lại, như thể con quái vật đang hút ánh sáng từ bầu trời, thay thế bằng một đám mây đêm vĩnh cửu.","candidate2":"Gầm gừ và rít lên, sinh vật đó bay vút lên, phun nước bọt vào không khí. Mọi thứ đột nhiên tối sầm lại, như thể con quái vật đang hút cạn ánh sáng từ chính bầu trời, thay thế nó bằng một đám mây đêm vĩnh cửu."},{"id":22,"chapter":"zh-kongyiji/01","workId":"zh-kongyiji","stratum":"addressing","srcText":"中秋过后，秋风是一天凉比一天，看看将近初冬；我整天的靠着火，也须穿上棉袄了。一天的下半天，没有一个顾客，我正合了眼坐着。忽然间听得一个声音，『温一碗酒。』这声音虽然极低，却很耳熟。看时又全没有人。站起来向外一望，那孔乙己便在柜台下对了门槛坐着。他脸上黑而且瘦，已经不成样子；穿一件破夹袄，盘着两腿，下面垫一个蒲包，用草绳在肩上挂住；见了我，又说道，『温一碗酒。』掌柜也伸出头去，一面说：『孔乙己么？你还欠十九个钱呢！』孔乙己很颓唐的仰面答道，『这……下回还清罢。这一回是现钱，酒要好。』掌柜仍然同平常一样，笑着对他说，『孔乙己，你又偸了东西了！』但他这回却不十分分辩，单说了一句『不要取笑！』『取笑？要是不偸，怎么会打断腿？』孔乙己低声说道：『跌断，跌，跌……』他的眼色，很像恳求掌柜，不要再提。此时已经聚集了几个人，便和掌柜都笑了。我温了酒，端出去，放在门槛上。他从破衣袋里摸出四文大钱，放在我手里，见他满手是泥，原来他便用这手走来的。不一会，他喝完酒，便又在旁人的说笑声中，坐着用这手慢慢走去了。","candidate1":"Sau Trung Thu, gió thu mỗi ngày một lạnh, thoắt cái đã gần đầu đông; tôi suốt ngày dựa vào lò sưởi, cũng phải mặc áo bông rồi. Một buổi chiều, không có một khách hàng nào, tôi đang nhắm mắt ngồi. Bỗng nhiên nghe thấy một tiếng nói: “Hâm một bát rượu.” Tiếng nói này tuy rất nhỏ, nhưng lại rất quen tai. Nhìn thì lại chẳng thấy ai. Đứng dậy nhìn ra ngoài, thì thấy Khổng Ất Kỷ đang ngồi dưới quầy, đối diện ngưỡng cửa. Mặt ông ta đen và gầy, đã không còn ra hình người; mặc một chiếc áo bông cũ rách, khoanh hai chân, phía dưới lót một bao cói, dùng dây rơm buộc qua vai; thấy tôi, lại nói: “Hâm một bát rượu.” Ông chủ cũng thò đầu ra, vừa nói: “Khổng Ất Kỷ à? Ông vẫn còn nợ mười chín đồng đó!” Khổng Ất Kỷ thất thểu ngẩng mặt lên đáp: “Cái này… lần sau sẽ trả hết vậy. Lần này là tiền mặt, rượu phải ngon.” Ông chủ vẫn như thường lệ, cười mà nói với ông ta: “Khổng Ất Kỷ, ông lại trộm đồ rồi!” Nhưng lần này ông ta không biện bạch nhiều, chỉ nói một câu: “Đừng trêu chọc nữa!” “Trêu chọc ư? Nếu không trộm, sao lại bị đánh gãy chân?” Khổng Ất Kỷ khẽ nói: “Ngã gãy, ngã, ngã…” Ánh mắt ông ta rất giống đang cầu xin ông chủ, đừng nhắc lại nữa. Lúc này đã có vài người tụ tập lại, liền cùng ông chủ cười phá lên. Tôi hâm rượu xong, bưng ra, đặt trên ngưỡng cửa. Ông ta mò ra bốn đồng tiền lớn từ túi áo rách, đặt vào tay tôi, thấy tay ông ta đầy bùn đất, hóa ra ông ta dùng tay đó mà đi đến. Một lát sau, ông ta uống hết rượu, rồi lại trong tiếng cười đùa của những người xung quanh, ngồi dùng bàn tay đó mà chầm chậm rời đi.","candidate2":"Sau Trung thu, gió thu ngày càng lạnh, nhìn xem đã gần đầu đông; tôi suốt ngày tựa bên lửa, cũng phải mặc áo bông rồi. Chiều hôm đó, không có một khách nào, tôi đang nhắm mắt ngồi. Bỗng nhiên nghe thấy một giọng nói: \"Hâm một bát rượu.\" Giọng nói này tuy rất khẽ, nhưng lại rất quen thuộc. Nhìn thì lại chẳng thấy ai. Đứng dậy nhìn ra ngoài, thì ra Khổng Ất Kỷ đang ngồi dưới quầy, đối diện ngưỡng cửa. Mặt ông ta đen sạm và gầy gò, đã không còn ra hình người; mặc một chiếc áo bông rách, khoanh hai chân, phía dưới kê một túi bện bằng cói, dùng dây cỏ buộc ngang vai; thấy tôi, ông ta lại nói: \"Hâm một bát rượu.\" Chủ quán cũng thò đầu ra, vừa nói: \"Khổng Ất Kỷ đó ư? Ông vẫn còn thiếu mười chín đồng đấy!\" Khổng Ất Kỷ rất rầu rĩ ngửa mặt đáp: \"Chuyện này... lần sau sẽ trả hết vậy. Lần này là tiền mặt, rượu phải ngon.\" Chủ quán vẫn như thường lệ, cười nói với ông ta: \"Khổng Ất Kỷ, ông lại trộm đồ rồi!\" Nhưng lần này ông ta lại không biện bạch nhiều, chỉ nói một câu: \"Đừng đùa cợt!\" \"Đùa cợt á? Nếu không trộm, sao lại bị đánh gãy chân?\" Khổng Ất Kỷ khẽ nói: \"Ngã gãy, ngã, ngã...\" Ánh mắt ông ta rất giống đang cầu xin chủ quán đừng nhắc đến nữa. Lúc này đã tụ tập vài người, liền cùng chủ quán cười phá lên. Tôi hâm rượu xong, mang ra, đặt lên ngưỡng cửa. Ông ta từ trong túi áo rách mò ra bốn đồng tiền lớn, đặt vào tay tôi, thấy tay ông ta đầy bùn, thì ra ông ta đã dùng tay này để chống đi. Chẳng mấy chốc, ông ta uống xong rượu, rồi lại trong tiếng nói cười của những người xung quanh, ngồi dựa vào tay ấy mà từ từ đi mất."},{"id":23,"chapter":"ja-irene/03","workId":"ja-irene","stratum":"glossary","srcText":"「そんな、どうしてですか。わたし、ヴィルヘルム様の従姉妹ですよ。マクシミリアン様の姪です！」","candidate1":"Tôi cảm giác có ai đó vuốt ve mình, nhưng chắc là mơ thôi. Trong căn biệt thự này, làm gì có ai lại vuốt ve đầu tôi chứ.","candidate2":"«Sao lại thế, tại sao ạ? Tôi là em họ của ngài Wilhelm mà. Tôi là cháu gái của ngài Maximilian!»"},{"id":24,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"ordinary","srcText":"　顔を見た途端に、この子にまつわる記憶がまとめて流れ込んでくる。生まれた日のこと、熱を出した夜のこと、初めて馬に乗った日のこと。他のどの記憶より鮮明で、他のどの記憶より数が多い。","candidate1":"Ngay khi nhìn thấy khuôn mặt đó, những ký ức liên quan đến đứa trẻ này ùa về cùng lúc. Ngày sinh ra, đêm sốt, ngày đầu tiên cưỡi ngựa. Những ký ức này T SÁT NHÂN HƠN VÀ KÉM KHẢ NĂNG HỦY DIỆT VŨ TRỤ HƠN MÀ THÔI.\"","candidate2":"\"ĐÚNG VẬY. CHÍNH XÁC LÀ VẬY. CÓ THỂ CÒN NHIỀU HƠN NỮA. NHƯNG TÔI KHÔNG THỂ BẮN VÀO ĐẦU CHÚNG. TÔI KHÔNG CÓ SÚNG. VÀ HAI ĐẤU MỘT LÀ KHÔNG CÔNG BẰNG, ĐÚNG KHÔNG?\" Thassalin đi đến chỗ Kayel và vỗ đầu cậu. \"CẢM ƠN, NHÓC CON. NHÓC GỢI NHỚ CHO TA VỀ NGƯỜI BẠN CŨ ARKADIN CỦA TA. CHỈ LÀ ÍT TÀN NHẪN HƠN VÀ KÉM KHẢ NĂNG HỦY DIỆT VŨ TRỤ HƠN.\""},{"id":29,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"glossary","srcText":"　ヴィルヘルムが、本気で不思議そうな顔をする。","candidate1":"Wilhelm thực sự tỏ vẻ ngạc nhiên.","candidate2":"Wilhelm thật sự tỏ vẻ khó hiểu."},{"id":30,"chapter":"ja-irene/05","workId":"ja-irene","stratum":"ordinary","srcText":"　自室に戻って鏡を覗くと、頬がうっすらと赤くなっていた。痛み自体は大したことはなく、剣の稽古で打ち身を作ったときのほうがよほど痛かったはずなのに、寝台に腰を下ろしてからもしばらく、僕は頬から手を離せずにいた。","candidate1":"Khi trở về phòng và nhìn vào gương, má tôi hơi đỏ ửng. Cơn đau không đáng kể, đáng lẽ phải đau hơn nhiều khi bị bầm tím trong lúc luyện kiếm, thế mà sau khi ngồi xuống giường một lúc, tôi vẫn không thể rời tay khỏi má.","candidate2":"Trở về phòng, tôi nhìn vào gương và thấy má mình hơi đỏ lên. Cơn đau không lớn lắm, lẽ ra phải đau hơn nhiều khi bị bầm tím trong buổi tập kiếm, nhưng sau khi ngồi xuống giường, tôi vẫn không thể rời tay khỏi má mình trong một lúc."},{"id":31,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"addressing","srcText":"「母様が君を呼ぶわけがないだろう！　そこで言い争いになって、腹を立てて手が出たのではないか」","candidate1":"“Mẹ không đời nào gọi cô! Chẳng lẽ hai người đã cãi nhau ở đó, rồi cô tức giận mà ra tay đẩy mẹ ư?!”","candidate2":"“Mẫu thân không đời nào gọi cô cả! Chẳng lẽ hai người đã cãi nhau ở đó, rồi cô tức giận nên ra tay sao?”"},{"id":32,"chapter":"zh-kongyiji/01","workId":"zh-kongyiji","stratum":"glossary","srcText":"孔乙己喝过半碗酒，涨红的脸色渐渐复了原，旁人便又问道，『孔乙己，你当真认识字么？』孔乙己看着问他的人，显出不屑置辩的神气。他们便接着说道：『你怎的连半个秀才也捞不到呢？』孔乙己立刻显出颓唐不安模样，脸上笼上了一层灰色，嘴里说些话；这回可是全是之乎者也之类，一些不懂了。在这时候，众人也都哄笑起来：店内外充满了快活的空气。","candidate1":"Khổng Ất Kỷ uống được nửa bát rượu, sắc mặt đỏ ửng dần trở lại bình thường, người khác lại hỏi: “Khổng Ất Kỷ, ông thật sự biết chữ sao?” Khổng Ất Kỷ nhìn người hỏi ông ta, tỏ vẻ khinh thường không muốn tranh cãi. Họ liền tiếp lời: “Sao ông lại ngay cả nửa tú tài cũng không kiếm được?” Khổng Ất Kỷ lập tức lộ vẻ sa sút tinh thần, bất an, trên mặt phủ một lớp xám xịt, trong miệng lẩm bẩm vài lời; lần này thì toàn là những câu “chi hô giả dã” các loại, hoàn toàn không hiểu gì. Lúc này, mọi người cũng đều ồ lên cười: trong ngoài quán tràn ngập không khí vui vẻ.","candidate2":"Khổng Ất Kỷ uống được nửa bát rượu, sắc mặt đỏ bừng dần trở lại bình thường, người bên cạnh liền hỏi: \"Khổng Ất Kỷ, ông thật sự biết chữ sao?\" Khổng Ất Kỷ nhìn người hỏi mình, lộ ra vẻ không thèm tranh cãi. Họ liền nói tiếp: \"Sao ông ngay cả nửa chức tú tài cũng không kiếm được vậy?\" Khổng Ất Kỷ lập tức lộ vẻ sa sút bất an, trên mặt phủ một lớp xám xịt, miệng nói lẩm bẩm; lần này thì toàn là những lời \"chi hồ giả dã\" các loại, chẳng ai hiểu gì nữa. Lúc này, mọi người cũng đều phá lên cười: trong ngoài quán tràn ngập không khí vui vẻ."},{"id":33,"chapter":"ja-irene/04","workId":"ja-irene","stratum":"ordinary","srcText":"　そうして、少しずつ、ご自分のものを手放していかれた。","candidate1":"Và cứ thế, dần dần, người đã từ bỏ những gì thuộc về bản thân mình.","candidate2":"Và cứ thế, dần dần, người đã từ bỏ những gì là của riêng mình."},{"id":34,"chapter":"zh-kongyiji/01","workId":"zh-kongyiji","stratum":"addressing","srcText":"孔乙己是站着喝酒而穿长衫的唯一的人。他身材很高大；青白脸色，皱纹间时常夹些伤痕；一部乱蓬蓬的花白的胡子。穿的虽然是长衫，可是又脏又破，似乎十多年没有补，也没有洗。他对人说话，总是满口之乎者也，教人半懂不懂的。因为他姓孔，别人便从描红纸上的『上大人孔乙己』这半懂不懂的话里，替他取下一个绰号，叫作孔乙己。孔乙己一到店，所有喝酒的人便都看着他笑，有的叫道：『孔乙己，你脸上又添上新伤疤了！』他不回答，对柜里说：『温两碗酒，要一碟茴香豆。』便排出九文大钱。他们又故意的高声嚷道：『你一定又偸了人家的东西了！』孔乙己睁大眼睛说：『你怎么这样凭空污人清白……』『什么清白？我前天亲眼见你偸了何家的书，吊着打。』孔乙己便涨红了脸，额上的青筋条条绽出，争辩道：『窃书不能算偸……窃书！……读书人的事，能算偸么？』接连便是难懂的话，什么『君子固穷』，什么『者乎』之类，引得众人都哄笑起来；店内外充满了快活的空气。","candidate1":"Khổng Ất Kỷ là người duy nhất vừa đứng uống rượu vừa mặc áo dài. Ông ta dáng người cao lớn; mặt mày xanh xao, giữa các nếp nhăn thường xen lẫn vết sẹo; một bộ râu trắng lởm chởm. Mặc dù là áo dài, nhưng lại vừa bẩn vừa rách, dường như mười mấy năm rồi không vá cũng không giặt. Ông ta nói chuyện với người khác, lúc nào cũng đầy rẫy \"chi hồ giả dã\", khiến người ta nửa hiểu nửa không. Vì ông ta họ Khổng, người khác bèn từ câu \"Thượng đại nhân Khổng Ất Kỷ\" nửa hiểu nửa không trên giấy tập viết chữ đỏ mà đặt cho ông ta một biệt hiệu, gọi là Khổng Ất Kỷ. Khổng Ất Kỷ vừa đến quán, tất cả những người uống rượu đều nhìn ông ta cười, có người gọi to: \"Khổng Ất Kỷ, mặt ông lại có thêm vết sẹo mới rồi!\" Ông ta không trả lời, nói với trong quầy: \"Hâm hai bát rượu, thêm một đĩa đậu hồi.\" Rồi đặt ra chín đồng tiền lớn. Họ lại cố ý lớn tiếng nói: \"Chắc chắn ông lại trộm đồ của người ta rồi!\" Khổng Ất Kỷ trừng mắt nói: \"Sao anh lại vu khống sự trong sạch của người khác như vậy...\" \"Trong sạch gì chứ? Hôm kia tôi tận mắt thấy ông trộm sách nhà họ Hà, bị treo lên đánh.\" Khổng Ất Kỷ liền đỏ bừng mặt, gân xanh trên trán nổi lên từng đường, cãi lại: \"Trộm sách không thể coi là trộm... Trộm sách! ... Việc của người đọc sách, có thể coi là trộm sao?\" Tiếp theo là những lời khó hiểu, nào là \"quân tử cố cùng\", nào là \"giả hồ\" các loại, khiến mọi người đều phá lên cười; trong ngoài quán tràn ngập không khí vui vẻ.","candidate2":"Khổng Ất Kỷ là người duy nhất đứng uống rượu mà lại mặc áo dài. Thân hình ông ta cao lớn; sắc mặt trắng xanh, giữa các nếp nhăn thường xen lẫn những vết sẹo; một bộ râu hoa râm bù xù. Tuy mặc áo dài, nhưng lại dơ và rách, dường như mười mấy năm không được vá, cũng chẳng được giặt. Ông ta nói chuyện với người khác, lúc nào cũng đầy “chi hô giả dã”, khiến người ta nửa hiểu nửa không. Vì ông ta họ Khổng, nên người ta mới lấy cái câu nửa hiểu nửa không “Thượng đại nhân Khổng Ất Kỷ” trên giấy tập viết chữ son mà đặt cho ông ta một biệt hiệu, gọi là Khổng Ất Kỷ. Khổng Ất Kỷ vừa đến quán, tất cả những người đang uống rượu đều nhìn ông ta mà cười, có người gọi: “Khổng Ất Kỷ, trên mặt ông lại thêm vết sẹo mới rồi!” Ông ta không trả lời, nói với người trong quầy: “Hâm hai bát rượu, lấy một đĩa đậu hồi.” Rồi đặt chín đồng tiền lớn ra. Họ lại cố ý lớn tiếng trêu chọc: “Ông lại vừa trộm đồ của nhà người khác rồi!” Khổng Ất Kỷ trừng mắt nói: “Sao các người lại vu khống sự trong sạch của người ta như vậy…” “Trong sạch gì?” Hôm kia tôi tận mắt thấy ông trộm sách nhà họ Hà, bị treo lên đánh.” Khổng Ất Kỷ liền đỏ mặt tía tai, gân xanh trên trán nổi lên từng vệt, cãi lại: “Trộm sách không thể gọi là trộm… Trộm sách! ...Chuyện của người đọc sách, có thể gọi là trộm sao?” Tiếp đó là những lời khó hiểu, nào là “quân tử cố bần”, nào là “giả hồ” các loại, khiến mọi người đều bật cười; trong ngoài quán tràn ngập không khí vui vẻ."},{"id":35,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"glossary","srcText":"\"I guess that's the other big scary monster that Lanex was worried about?\" Kayel frowned as he attempted to take a shot at the second beast, missed and swiftly reloaded.","candidate1":"\"Tôi đoán đó là con quái vật to lớn đáng sợ khác mà Lanex đã lo lắng phải không?\" Kayel cau mày khi cố gắng bắn con thú thứ hai, trượt và nhanh chóng nạp đạn lại.","candidate2":"“Tôi đoán đó là con quái vật đáng sợ khổng lồ khác mà Lanex lo lắng?” Kayel cau mày khi cố gắng bắn con thú thứ hai, trượt và nhanh chóng nạp đạn lại."},{"id":36,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"ordinary","srcText":"\"THAT'S GONNA BE TRICKY!\"","candidate1":"“Sẽ khó khăn đấy!”","candidate2":"\"ĐIỀU ĐÓ SẼ KHÓ KHĂN ĐẤY!\""},{"id":37,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"addressing","srcText":"\"Oops...\" Retvik muttered from the driver's seat, before awkwardly switching the engine off and climbing out of the truck. \"I, uh, did not mean to do that. Are you all well?\"","candidate1":"\"Ối...\" Retvik lẩm bẩm từ ghế lái, trước khi vụng về tắt máy và leo ra khỏi xe tải. \"Tôi, ừm, không cố ý làm vậy. Mọi người có ổn không?\"","candidate2":"\"Ối...\" Retvik lẩm bẩm từ ghế lái, trước khi lúng túng tắt máy và trèo ra khỏi xe tải. \"Tôi, ừm, không có ý làm vậy. Mọi người vẫn ổn chứ?\""},{"id":38,"chapter":"zh-hant-xiyouji/02","workId":"zh-hant-xiyouji","stratum":"glossary","srcText":"原來人得仙體，出神變化無方。不知這猴王自從了道之後，身上有八萬四千毛羽，根根能變，應物隨心。那些小猴眼乖會跳，刀來砍不著，槍去不能傷。你看他前踴後躍，鑽上去，把個魔王圍繞，抱的抱，扯的扯，鑽襠的鑽襠，扳腳的扳腳，踢打撏毛，摳眼睛，捻鼻子，擡鼓弄，直打做一個攢盤。這悟空才去奪得他的刀來，分開小猴，照頂門一下，砍為兩段。領眾殺進洞中，將那大小妖精盡皆剿滅。卻把毫毛一抖，收上身來，又見那收不上身者，卻是那魔王在水簾洞擒去的小猴。悟空道：「汝等何為到此？」約有三五十個，都含淚道：「我等因大王修仙去後，這兩年被他爭吵，把我們都攝將來。那不是我們洞中的家火？石盆、石碗都被這廝拿來也。」悟空道：「既是我們的家火，你們都搬出外去。」隨即洞裡放起火來，把那水臟洞燒得枯乾，盡歸了一體。對眾道：「汝等跟我回去。」眾猴道：「大王，我們來時，只聽得耳邊風響，虛飄飄到於此地，更不識路徑，今怎得回鄉？」悟空道：「這是他弄的個術法兒，有何難也？我如今一竅通，百竅通，我也會弄。你們都合了眼，休怕。」","candidate1":"Hóa ra người đã đắc tiên thể, xuất thần biến hóa không giới hạn. Không biết hầu vương này từ khi đắc đạo, trên thân có tám vạn bốn nghìn lông, mỗi sợi đều có thể biến hóa, ứng vật tùy tâm. Bọn khỉ nhỏ đó lanh mắt nhanh nhẹn, đao chém không trúng, thương đâm không bị thương. Ngươi xem chúng nhảy nhót trước sau, luồn lên, vây quanh yêu vương, đứa ôm, đứa kéo, đứa chui vào hạ bộ, đứa bẻ chân, đứa đá đánh giật lông, móc mắt, vặn mũi, khiêng lên trêu chọc, đánh cho yêu vương thành một mớ bòng bong. Ngộ Không lúc này mới đoạt được đao của hắn, xua bọn khỉ nhỏ ra, chém một nhát vào đầu, chặt làm hai đoạn. Dẫn chúng xông vào trong động, tiêu diệt hết sạch cả yêu tinh lớn nhỏ. Đoạn Ngộ Không giũ lông, thu về thân, lại thấy những sợi lông không thu về được, hóa ra đó là những con khỉ nhỏ bị yêu vương bắt đi từ Thủy Liêm Động. Ngộ Không hỏi: “Các ngươi vì sao đến đây?” Khoảng ba, năm mươi con, đều rưng rưng nước mắt nói: “Chúng con vì Đại Vương đi tu tiên, hai năm nay bị hắn gây sự, bắt hết chúng con đến đây. Đấy chẳng phải là đồ dùng trong động của chúng con ư? Chậu đá, bát đá đều bị thằng này lấy trộm đến đây ạ.” Ngộ Không nói: “Đã là đồ dùng của chúng ta thì các ngươi mau dọn ra ngoài đi.” Ngay sau đó, lửa bốc cháy trong động, đốt cho cái động bẩn thỉu khô cạn, tất cả hóa thành tro bụi. Ngộ Không nói với bọn khỉ: “Các ngươi đi theo ta về.” Bọn khỉ nói: “Đại Vương, khi chúng con đến đây, chỉ nghe tiếng gió bên tai, lơ lửng bay đến chỗ này, hoàn toàn không biết đường đi, giờ làm sao về được quê hương?” Ngộ Không nói: “Đây là phép thuật hắn dùng, có gì khó đâu? Bây giờ ta một khiếu thông, trăm khiếu thông, ta cũng biết làm. Các ngươi nhắm mắt lại, đừng sợ.”","candidate2":"Hảo Hầu Vương, niệm thần chú, cưỡi một trận cuồng phong, hạ xuống đầu đám mây. Hô: “Các con mở mắt ra!” Đám khỉ đặt chân xuống đất, nhận ra quê hương, đứa nào đứa nấy đều vui mừng, chạy ùa về đường cũ cửa động. Đám khỉ trong động cũng ùa ra đón, theo thứ tự lớp lang, lạy bái hầu vương. Sắp đặt rượu quả, mở tiệc mừng, hỏi thăm chuyện hàng yêu cứu con. Ngộ Không kể tỉ mỉ một lượt, đám khỉ ca ngợi không ngớt: “Đại Vương đi đến phương nào, không ngờ học được những thủ đoạn lợi hại như vậy!” Ngộ Không lại nói: “Năm xưa ta từ biệt các ngươi, trôi dạt theo dòng nước, vượt qua Đông Dương Đại Hải, đến địa giới Tây Ngưu Hạ Châu, thẳng đến Nam Thiệm Bộ Châu, học thành hình người, mặc áo này, đi giày này, lêu bêu, vân du tám chín năm trời, nhưng vẫn chưa đắc đạo. Lại vượt Tây Dương Đại Hải, đến địa giới Tây Ngưu Hạ Châu, tìm kiếm hồi lâu, may mắn gặp được một lão tổ, truyền cho ta công phu chân chính cùng trời đất, pháp môn trường sinh bất tử.” Đám khỉ cùng chúc mừng, đều nói: “Vạn kiếp khó gặp!” Ngộ Không lại cười nói: “Các tiểu đệ, lại mừng vì môn phái của ta đều có họ rồi.” Đám khỉ nói: “Đại Vương họ gì?” Ngộ Không nói: “Ta nay họ Tôn, pháp danh Ngộ Không.” Đám khỉ nghe vậy, vỗ tay vui mừng nói: “Đại Vương là Lão Tôn, chúng tôi đều là Nhị Tôn, Tam Tôn, Tứ Tôn, Tiểu Tôn… một nhà Tôn, một nước Tôn, một ổ Tôn!” Đều đến phụng thờ Lão Tôn, dâng rượu dừa, rượu nho, tiên hoa, tiên quả đầy những chậu lớn bát nhỏ, thật là cả nhà vui vẻ. Chà!"},{"id":39,"chapter":"ja-irene/01","workId":"ja-irene","stratum":"ordinary","srcText":"　ようやく、階段から落ちる前のことを思い dài và dừng lại ngay chân Nyssi. Không mạo hiểm, Nyssi vớ lấy khẩu súng ngắn và ngay lập tức bắn vào đầu nó, giết chết sinh vật ngay lập tức.","candidate2":"Trước khi Tenuk và Kayel kịp hỏi đây là cái thứ quái quỷ gì, một thứ gì đó rít lên và nhảy xổ ra từ bụi cây gần đó. Tuy nhiên, nó không kịp chạm tới, vì một chiếc xe quen thuộc đã đâm sầm vào bên cạnh nó, khiến con quái vật trượt dài và dừng lại ngay chân Nyssi. Không chần chừ, Nyssi chộp lấy khẩu shotgun và bắn thẳng vào sọ nó ngay lập tức, giết chết con quái vật ngay tức khắc."},{"id":49,"chapter":"ja-irene/05","workId":"ja-irene","stratum":"ordinary","srcText":"　頬を打たれたのは、生まれて初めてのことだった。","candidate1":"Bị tát vào má là lần đầu tiên trong đời tôi.","candidate2":"Bị tát vào má là lần đầu tiên trong đời tôi."},{"id":50,"chapter":"zh-hant-xiyouji/02","workId":"zh-hant-xiyouji","stratum":"glossary","srcText":"忽一日，祖師與眾門人在三星洞前戲玩晚景。祖師道：「悟空，事成了未曾？」悟空道：「多蒙師父海恩，弟子功果完備，已能霞舉飛昇也。」祖師道：「你試飛舉我看。」悟空弄本事，將身一聳，打了個連扯跟頭，跳離地有五六丈，踏雲霞去勾有頓飯之時，返復不上三里遠近，落在面前，扠手道：「師父，這就是飛舉騰雲了。」祖師笑道：「這個算不得騰雲，只算得爬雲而已。自古道：『神仙朝遊北海暮蒼梧。』似你這半日，去不上三里，即爬雲也還算不得哩。」悟空道：「怎麼為『朝遊北海暮蒼梧』？」祖師道：「凡騰雲之輩，早辰起自北海，遊過東海、西海、南海，復轉蒼梧。蒼梧者，卻是北海零陵之語話也。將四海之外，一日都遊遍，方算得騰雲。」悟空道：「這個卻難，卻難。」祖師道：「世上無難事，只怕有心人。」悟空聞得此言，叩頭禮拜，啟道：「師父，為人須為徹，索性捨個大慈悲，將此騰雲之法，一發傳與我罷，決不敢忘恩。」祖師道：「凡諸仙騰雲，皆跌足而起，你卻不是這般。我才見你去，連扯方才跳上。我今只就你這個勢，傳你個觔斗雲罷。」悟空又禮拜懇求，祖師卻又傳個口訣道：「這朵雲，捻著訣，念動真言，攢緊了拳，將身一抖，跳將起來，一觔斗就有十萬八千里路哩。」大眾聽說，一個個嘻嘻笑道：「悟空造化，若會這個法兒，與人家當鋪兵、送文書、遞報單，不管那裡都尋了飯吃。」師徒們天昏各歸洞府。","candidate1":"Bỗng một ngày, Tổ Sư cùng các môn nhân đùa giỡn ngắm cảnh chiều tà trước động Tam Tinh. Tổ Sư nói: \"Ngộ Không, việc đã thành chưa?\" Ngộ Không nói: \"Đa tạ ơn biển của sư phụ, đệ tử công quả đã viên mãn, đã có thể cất mình bay lên rồi ạ.\" Tổ Sư nói: \"Con thử bay lên cho ta xem.\" Ngộ Không trổ tài, nhún mình một cái, lộn mấy vòng liền, nhảy lên khỏi mặt đất năm sáu trượng, đạp mây bay đi khoảng một bữa cơm, trở đi trở lại chưa tới ba dặm, rồi đáp xuống trước mặt, chắp tay nói: \"Sư phụ, đây chính là cất mình cưỡi mây rồi ạ.\" Tổ Sư cười nói: \"Cái này không thể gọi là cưỡi mây, chỉ có thể coi là bò mây thôi. Từ xưa đã nói: 'Thần tiên sáng du Bắc Hải, chiều Thương Ngô.' Như con đây, nửa ngày mà chưa đi được ba dặm, thì ngay cả bò mây cũng không tính là gì.\" Ngộ Không nói: \"Thế nào mới là 'sáng du Bắc Hải, chiều Thương Ngô'?\" Tổ Sư nói: \"Phàm những kẻ cưỡi mây, sáng sớm từ Bắc Hải, bay qua Đông Hải, Tây Hải, Nam Hải, rồi quay lại Thương Ngô. Thương Ngô ấy, chính là lời nói về Lăng Lăng ở Bắc Hải. Đi khắp bốn biển trong một ngày, đó mới tính là cưỡi mây.\" Ngộ Không nói: \"Cái này thì khó, khó lắm.\" Tổ Sư nói: \"Việc trên đời không khó, chỉ sợ lòng người không kiên.\" Ngộ Không nghe lời ấy, dập đầu lạy tạ, thưa rằng: \"Sư phụ, đã giúp thì giúp cho trót, xin hãy rủ lòng đại từ bi, truyền luôn cả phép cưỡi mây này cho con đi ạ, con quyết không dám quên ơn.\" Tổ Sư nói: \"Phàm các tiên cưỡi mây đều nhún chân mà bay lên, con thì không phải như vậy. Ta vừa thấy con đi, lộn mấy vòng mới nhảy lên được. Giờ ta cứ theo thế của con, truyền cho con phép Cân Đẩu Vân vậy.\" Ngộ Không lại lạy tạ cầu xin, Tổ Sư lại truyền khẩu quyết: \"Đám mây này, niệm chú, đọc chân ngôn, nắm chặt tay, rũ mình một cái, nhảy vọt lên, một cân đẩu là được mười vạn tám ngàn dặm đường đấy.\" Mọi người nghe vậy, ai nấy cười tủm tỉm nói: \"Ngộ Không gặp may rồi, nếu biết phép này, đi làm phu trạm, đưa văn thư, chuyển báo cáo cho người ta, đi đâu cũng kiếm được cơm ăn.\" Trời tối, thầy trò ai về động phủ nấy.","candidate2":"Người đạt được tiên thể, xuất thần biến hóa không lường. Không biết hầu vương này từ khi đắc đạo, trên người có tám vạn bốn nghìn sợi lông, sợi nào cũng có thể biến hóa, ứng vật tùy tâm. Những con khỉ nhỏ này mắt tinh lanh lẹ, đao chém không trúng, thương đâm không vào. Ngươi xem chúng nó nhảy nhót trước sau, xông lên vây lấy ma vương, kẻ ôm, kẻ kéo, kẻ chui háng, kẻ bẻ chân, kẻ đấm đá giật lông, kẻ móc mắt, kẻ vặn mũi, kẻ nâng bổng, đánh cho ma vương thành một đống bùng nhùng. Ngộ Không nhân cơ hội đoạt được đao của hắn,  một đồng nữa thì có thể mua một đĩa măng luộc muối, hoặc đậu hồi, làm đồ nhắm; nếu bỏ ra mười mấy đồng thì có thể mua một món mặn, nhưng những khách hàng này phần nhiều là đám áo ngắn, đại đa số không được sang trọng như vậy. Chỉ có những người mặc áo dài mới khoan thai bước vào căn phòng cạnh cửa hàng, gọi rượu gọi món, từ từ ngồi uống.","candidate2":"Cấu trúc quán rượu ở Lỗ Trấn khác biệt so với những nơi khác: tất cả đều là một quầy lớn hình thước thợ đặt sát mặt đường, bên trong quầy có sẵn nước nóng, có thể hâm rượu bất cứ lúc nào. Những người làm công, đến buổi trưa hoặc tối tan ca, thường bỏ ra bốn đồng tiền đồng, mua một bát rượu – chuyện này là của hơn hai mươi năm trước, giờ mỗi bát đã tăng lên mười đồng – đứng tựa vào quầy bên ngoài, uống nóng rồi nghỉ ngơi; nếu chịu khó chi thêm một đồng, có thể mua một đĩa măng luộc muối hoặc đậu hồi, làm đồ nhắm rượu. Nếu chi đến mười mấy đồng, thì có thể mua một món mặn, nhưng những khách hàng này đa phần là dân áo ngắn, nói chung không có được sự xa xỉ như vậy. Chỉ những người mặc áo dài mới khoan thai bước vào căn phòng bên cạnh cửa hàng, gọi rượu gọi món, ngồi nhâm nhi từ từ."},{"id":69,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"ordinary","srcText":"\"I APOLOGIZE BUT I PICKED UP A SCENT. I HAD TO DEAL WITH IT!\"","candidate1":"“TÔI XIN LỖI NHƯNG TÔI ĐÃ NGỬI THẤY MỘT MÙI HƯƠNG. TÔI PHẢI GIẢI QUYẾT NÓ!”","candidate2":"\"TÔI XIN LỖI NHƯNG TÔI ĐÃ NGỬI THẤY MỘT MÙI HƯƠNG. TÔI PHẢI XỬ LÝ NÓ!\""},{"id":70,"chapter":"en-fight-above-the-trees/01","workId":"en-fight-above-the-trees","stratum":"glossary","srcText":"\"HOW DO WE KILL THEM?\" Nyssi shouted.","candidate1":"“Làm thế nào để chúng ta giết chúng?” Nyssi hét lên.","candidate2":"\"LÀM SAO CHÚNG TA GIẾT CHÚNG ĐÂY?\" Nyssi hét lên."}];
